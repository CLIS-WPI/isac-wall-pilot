[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isac-verify"
version = "0.1.0"
description = "GPU-only Sionna pilot for active wall-assisted sensing verification"
requires-python = ">=3.12"
# torch and sionna are installed by the Dockerfile, not by pip resolving this
# package (see BRIEF §3.2).
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
