      heldout: [2201, 2202, 2203, 2204, 2205, 2206, 2207, 2208, 2209, 2210, 2211, 2212, 2213, 2214, 2215, 2216, 2217, 2218, 2219, 2220, 2221, 2222, 2223, 2224]
    probe_symbols:
      calibration: [3101, 3102, 3103, 3104, 3105, 3106, 3107, 3108, 3109, 3110, 3111, 3112]
      heldout: [3201, 3202, 3203, 3204, 3205, 3206, 3207, 3208, 3209, 3210, 3211, 3212, 3213, 3214, 3215, 3216, 3217, 3218, 3219, 3220, 3221, 3222, 3223, 3224]
    receiver_noise:
      calibration: [4101, 4102, 4103, 4104, 4105, 4106, 4107, 4108, 4109, 4110, 4111, 4112]
      heldout: [4201, 4202, 4203, 4204, 4205, 4206, 4207, 4208, 4209, 4210, 4211, 4212, 4213, 4214, 4215, 4216, 4217, 4218, 4219, 4220, 4221, 4222, 4223, 4224]
    relay_noise:
      calibration: [5101, 5102, 5103, 5104, 5105, 5106, 5107, 5108, 5109, 5110, 5111, 5112]
      heldout: [5201, 5202, 5203, 5204, 5205, 5206, 5207, 5208, 5209, 5210, 5211, 5212, 5213, 5214, 5215, 5216, 5217, 5218, 5219, 5220, 5221, 5222, 5223, 5224]
    diagnostic_beam_selection:
      calibration: [6101, 6102, 6103, 6104, 6105, 6106, 6107, 6108, 6109, 6110, 6111, 6112]
      heldout: [6201, 6202, 6203, 6204, 6205, 6206, 6207, 6208, 6209, 6210, 6211, 6212, 6213, 6214, 6215, 6216, 6217, 6218, 6219, 6220, 6221, 6222, 6223, 6224]

decisions:
  D2:
    type: interpretation
    brief_section: "5.1,7.1,9.2"
    choice: sionna_default_radio_material_slab
    config_key: wall
  D3:
    type: interpretation
    brief_section: "7.1,13.1,15"
    choice: explicit_flags_and_seed
    config_key: solver
  D4:
    type: interpretation
    brief_section: "7.1,7.2"
    choice: blank_scene_paths_plus_rcs_target
    config_key: primary_model
  D5:
    type: interpretation
    brief_section: "9.2,9.3,15"
    choice: v_equals_conj_a_tx
    config_key: steering
  D6:
    type: interpretation
    brief_section: "7.1,7.2,11"
    choice: exclude_gnb_self_direct_path_ideal_isolation
    config_key: background
  D7:
    type: interpretation
    brief_section: "7.4,11.1"
